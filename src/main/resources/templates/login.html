<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(102, 166, 255, 0.18);
            padding: 50px 40px 40px 40px;
            max-width: 70vw;
            width: 100%;
            margin: 40px auto;
        }

        .carousel-inner img {
            border-radius: 12px;
            height: 400px;
            object-fit: cover;
        }

        .login-title {
            font-weight: bold;
            font-size: 2rem;
            margin-bottom: 30px;
            color: #3a3a3a;
            letter-spacing: 2px;
            text-align: center;
        }

        .form-control {
            border-radius: 8px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.9);
        }

        .btn-login {
            width: 100%;
            border-radius: 8px;
            font-size: 1.2rem;
            background: linear-gradient(90deg, #21D4FD 0%, #B721FF 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(33, 212, 253, 0.2);
            transition: background 0.3s;
        }

        .btn-login:hover {
            background: linear-gradient(90deg, #B721FF 0%, #21D4FD 100%);
        }

        @media (max-width: 1200px) {
            .login-container {
                max-width: 90vw;
                padding: 30px 10px 20px 10px;
            }

            .carousel-inner img {
                height: 250px;
            }
        }

        @media (max-width: 768px) {
            body {
                background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
            }

            .login-container {
                max-width: 92vw;
                margin: 6vw auto;
                padding: 7vw 4vw 6vw 4vw;
                border-radius: 18px;
                background: rgba(255, 255, 255, 0.92);
                box-shadow: 0 4px 24px rgba(102, 166, 255, 0.1);
            }

            .login-title {
                font-size: 2.1rem;
                font-weight: 800;
                letter-spacing: 3px;
                margin-bottom: 36px;
                color: #222;
                text-shadow: 0 2px 8px rgba(33, 212, 253, 0.08);
            }

            .form-group {
                margin-bottom: 2.2rem;
            }

            .form-control {
                border-radius: 12px;
                font-size: 1.15rem;
                padding: 1rem 1.2rem;
                box-shadow: 0 1px 6px rgba(102, 166, 255, 0.06);
                border: 1px solid #e0e7ef;
            }

            .btn-login {
                font-size: 1.25rem;
                padding: 0.85rem 0;
                border-radius: 16px;
                margin-top: 18px;
                letter-spacing: 0.3em;
                box-shadow: 0 2px 12px rgba(33, 212, 253, 0.1);
            }

            label {
                font-size: 1.08rem;
                color: #444;
                margin-bottom: 0.5rem;
                font-weight: 600;
            }

            .col-md-7 {
                display: none !important;
            }

            .login-logo {
                display: flex;
                justify-content: center;
                align-items: center;
                margin-bottom: 8px;
            }

            .login-card {
                background: linear-gradient(180deg, #f7fbff 60%, #e3f0ff 100%);
                border-radius: 18px;
                box-shadow: 0 2px 16px rgba(102, 166, 255, 0.08);
                padding: 32px 18px 28px 18px;
                margin: 0 auto;
                max-width: 100%;
            }

            .login-title-group {
                display: flex;
                flex-direction: column;
                /* 纵向排列 */
                align-items: center;
                justify-content: center;
                margin-bottom: 24px;
                gap: 10px;
                /* 图标和标题间距 */
            }

            .login-title-group i {
                margin-right: 0;
                /* 取消右侧间距 */
            }

            .login-title {
                font-size: 2rem;
                font-weight: 700;
                color: #333;
                letter-spacing: 1px;
                text-align: center;
                flex: none;
            }
        }
    </style>
</head>

<body>
    <div class="container login-container">
        <div class="row">
            <div class="col-md-7 mb-4 mb-md-0">
                <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
                    <ol class="carousel-indicators">
                        <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
                        <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
                        <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
                    </ol>
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="/img/1.jpg" class="d-block w-100" alt="...">
                        </div>
                        <div class="carousel-item">
                            <img src="/img/2.jpg" class="d-block w-100" alt="...">
                        </div>
                        <div class="carousel-item">
                            <img src="/img/3.jpg" class="d-block w-100" alt="...">
                        </div>
                    </div>
                    <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="sr-only">Previous</span>
                    </a>
                    <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="sr-only">Next</span>
                    </a>
                </div>
            </div>
            <div class="col-md-5 d-flex flex-column justify-content-center">
                <div class="login-card">
                    <div class="login-title-group mb-4">
                        <i class="fa fa-book" style="font-size:48px;color:#6c63ff;margin-right:14px;"></i>
                        <span class="login-title">图书借阅管理系统</span>
                    </div>
                    <form th:action="@{/login}" method="post">
                        <div th:if="${loginError}" class="alert alert-danger" style="text-align:center;">
                            <span th:text="${loginError}"></span>
                        </div>
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="password">密码</label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="请输入密码" required>
                        </div>
                        <button type="submit" class="btn btn-login">登&nbsp;&nbsp;&nbsp;&nbsp;录</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.staticfile.org/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdn.staticfile.org/popper.js/1.15.0/umd/popper.min.js"></script>
    <script src="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>

</html>
