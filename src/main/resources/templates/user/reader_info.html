<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>读者信息</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-image: url("/img/2.jpg");
            background-size: cover;
            min-height: 100vh;
        }
        .navbar-custom {
            background: linear-gradient(90deg, #21D4FD 0%, #B721FF 100%);
            font-size: 1.2rem;
        }
        .navbar-brand {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .navbar-nav .nav-link {
            font-size: 1.1rem;
            margin-right: 10px;
        }
        .dropdown-menu {
            min-width: 120px;
        }
        .user-info .dropdown-toggle {
            color: #fff !important;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 1.3rem;
            }
            .navbar-nav .nav-link {
                font-size: 1rem;
                margin-right: 0;
            }
        }
        .info-container {
            margin: 40px auto;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        label {
            margin: auto;
            padding-right: 20px;
        }
        .input-group {
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-custom navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">图书借阅管理系统</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/book/getAll}">图书信息</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/record/getOwnRecord}">借阅记录</a>
                </li>
            </ul>
            <div class="user-info ml-auto">
                <div class="dropdown">
                    <a class="dropdown-toggle" href="#" id="dropdownMenuButton" data-toggle="dropdown"
                       aria-haspopup="true" aria-expanded="false" th:text="${session.name}+', 您好'"></a>
                    <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" th:href="@{/user/toInfoPage}" sec:authorize="hasRole('USER')">个人信息</a>
                        <a class="dropdown-item" th:href="@{/toChPwdPage}">修改密码</a>
                        <a class="dropdown-item" th:href="@{/logout}">注销</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="info-container">
        <h2 class="mb-4 text-center">个人信息</h2>
        <form th:action="@{/user/info/update}" method="post">
            <div class="input-group">
                <label for="readerId">卡号</label>
                <input type="text" class="form-control" id="readerId" name="readerId" th:value="${info.getReaderId()}" readonly>
            </div>
            <div class="input-group">
                <label for="name">姓名</label>
                <input type="text" class="form-control" id="name" name="name" th:value="${info.getName()}">
            </div>
            <div class="input-group">
                <label for="sex">性别</label>
                <input type="text" class="form-control" id="sex" name="sex" th:value="${info.getSex()}">
            </div>
            <div class="input-group">
                <label for="birth">生日</label>
                <input type="text" class="form-control" id="birth" name="birth" th:value="${#dates.format(info.getBirth(),'yyyy-MM-dd')}">
            </div>
            <div class="input-group">
                <label for="address">地址</label>
                <input type="text" class="form-control" id="address" name="address" th:value="${info.getAddress()}">
            </div>
            <div class="input-group">
                <label for="telcode">电话</label>
                <input type="text" class="form-control" id="telcode" name="telcode" th:value="${info.getTelcode()}">
            </div>
            <input type="submit" value="修    改" class="btn btn-primary btn-block" style="margin-top: 20px">
            <a th:href="@{/}" class="btn btn-outline-secondary btn-block" style="margin-top: 10px">返&nbsp;&nbsp;&nbsp;&nbsp;回</a>
        </form>
    </div>
</div>

<script src="https://cdn.staticfile.org/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdn.staticfile.org/popper.js/1.15.0/umd/popper.min.js"></script>
<script src="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
