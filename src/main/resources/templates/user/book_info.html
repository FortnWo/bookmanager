<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>图书信息</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-image: url("/img/2.jpg");
            background-size: cover;
            min-height: 100vh;
        }
        .navbar-custom {
            background: linear-gradient(90deg, #21D4FD 0%, #B721FF 100%);
            font-size: 1.2rem;
        }
        .navbar-brand {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .navbar-nav .nav-link {
            font-size: 1.1rem;
            margin-right: 10px;
        }
        .dropdown-menu {
            min-width: 120px;
        }
        .user-info .dropdown-toggle {
            color: #fff !important;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 1.3rem;
            }
            .navbar-nav .nav-link {
                font-size: 1rem;
                margin-right: 0;
            }
        }
        .info-container {
            margin: 40px auto;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        th {
            width: 120px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-custom navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">图书借阅管理系统</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/user/book/getAll}">图书信息</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/record/getOwnRecord}">借阅记录</a>
                </li>
            </ul>
            <div class="user-info ml-auto">
                <div class="dropdown">
                    <a class="dropdown-toggle" href="#" id="dropdownMenuButton" data-toggle="dropdown"
                       aria-haspopup="true" aria-expanded="false" th:text="${session.name}+', 您好'"></a>
                    <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" th:href="@{/user/toInfoPage}" sec:authorize="hasRole('USER')">个人信息</a>
                        <a class="dropdown-item" th:href="@{/toChPwdPage}">修改密码</a>
                        <a class="dropdown-item" th:href="@{/logout}">注销</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="info-container">
        <h2 class="mb-4 text-center">图书信息</h2>
        <table class="table">
            <tr>
                <th>书名</th>
                <td th:text="${book.getName()}"></td>
            </tr>
            <tr>
                <th>作者</th>
                <td th:text="${book.getAuthor()}"></td>
            </tr>
            <tr>
                <th>出版社</th>
                <td th:text="${book.getPublish()}"></td>
            </tr>
            <tr>
                <th>ISBN</th>
                <td th:text="${book.getIsbn()}"></td>
            </tr>
            <tr>
                <th>简介</th>
                <td th:text="${book.getIntroduction()}"></td>
            </tr>
            <tr>
                <th>语言</th>
                <td th:text="${book.getLanguage()}"></td>
            </tr>
            <tr>
                <th>价格</th>
                <td th:text="${book.getPrice()}"></td>
            </tr>
            <tr>
                <th>出版日期</th>
                <td th:text="${#dates.format(book.getPubdate(),'yyyy-MM-dd')}"></td>
            </tr>
            <tr>
                <th>分类号</th>
                <td th:text="${book.getClassId()}"></td>
            </tr>
            <tr>
                <th>书架号</th>
                <td th:text="${book.getPressmark()}"></td>
            </tr>
            <tr>
                <th>状态</th>
                <td>
                    <span th:switch="${book.getState()}">
                        <span th:case="1">在馆</span>
                        <span th:case="0">缺货</span>
                    </span>
                </td>
            </tr>
        </table>
        <a th:href="@{/user/book/getAll}" class="btn btn-outline-primary btn-block btn-lg">返&nbsp;&nbsp;&nbsp;&nbsp;回</a>
    </div>
</div>

<script src="https://cdn.staticfile.org/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdn.staticfile.org/popper.js/1.15.0/umd/popper.min.js"></script>
<script src="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
