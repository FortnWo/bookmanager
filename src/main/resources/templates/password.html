<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>更改密码</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-image: url("/img/2.jpg");
            background-size: cover;
            min-height: 100vh;
        }
        .navbar-custom {
            background: linear-gradient(90deg, #21D4FD 0%, #B721FF 100%);
            font-size: 1.2rem;
        }
        .navbar-brand {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .navbar-nav .nav-link {
            font-size: 1.1rem;
            margin-right: 10px;
        }
        .dropdown-menu {
            min-width: 120px;
        }
        .user-info .dropdown-toggle {
            color: #fff !important;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 1.3rem;
            }
            .navbar-nav .nav-link {
                font-size: 1rem;
                margin-right: 0;
            }
        }
        .pwd-container {
            margin: 40px auto;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        label {
            margin: auto;
            padding-right: 20px;
        }
        .input-group {
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-custom navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">图书借阅管理系统</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav mr-auto" sec:authorize="hasRole('ADMIN')">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/book/getAll}">图书管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/reader/getAll}">读者管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/record/getAll}">借还管理</a>
                </li>
            </ul>
            <ul class="navbar-nav mr-auto" sec:authorize="hasRole('USER')">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/book/getAll}">图书信息</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/record/getOwnRecord}">借阅记录</a>
                </li>
            </ul>
            <div class="user-info ml-auto">
                <div class="dropdown">
                    <a class="dropdown-toggle" href="#" id="dropdownMenuButton" data-toggle="dropdown"
                       aria-haspopup="true" aria-expanded="false" th:text="${session.name}+', 您好'"></a>
                    <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" th:href="@{/user/toInfoPage}" sec:authorize="hasRole('USER')">个人信息</a>
                        <a class="dropdown-item" th:href="@{/toChPwdPage}">修改密码</a>
                        <a class="dropdown-item" th:href="@{/logout}">注销</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="pwd-container">
        <form th:action="@{/changePassword}" method="post" class="form">
            <div class="input-group">
                <label for="oldPassword">旧密码</label>
                <input type="password" class="form-control" id="oldPassword" name="oldPassword">
                <span class="invalid-feedback" id="errorPwd" style="display: none">
                    密码错误！
                </span>
            </div>
            <div class="input-group">
                <label for="newPassword">新密码</label>
                <input type="password" class="form-control" id="newPassword" name="newPassword">
                <span class="invalid-feedback" id="emptyPwd" style="display: none">
                    密码不能为空！
                </span>
            </div>
            <div class="input-group">
                <label for="checkPassword">确认密码</label>
                <input type="password" class="form-control" id="checkPassword" name="checkPassword">
                <span class="invalid-feedback" id="errorChecked" style="display: none">
                    两次输入密码不一致！
                </span>
            </div>
            <input type="submit" value="修    改" class="btn btn-primary btn-block" style="margin-top: 20px">
            <a th:href="@{/}" class="btn btn-outline-secondary btn-block" style="margin-top: 10px">返&nbsp;&nbsp;&nbsp;&nbsp;回</a>
        </form>
    </div>
</div>

<script src="https://cdn.staticfile.org/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdn.staticfile.org/popper.js/1.15.0/umd/popper.min.js"></script>
<script src="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
    $(function () {
        $("#oldPassword").blur(
            function () {
                $.post("/checkPassword",
                    {
                        password: $(this).val()
                    },
                    function (data) {
                        if (data == "0") {
                            $("#oldPassword").removeClass("is-valid");
                            $("#oldPassword").addClass("is-invalid");
                            $("#errorPwd").show();
                        } else {
                            $("#oldPassword").removeClass("is-invalid");
                            $("#oldPassword").addClass("is-valid");
                            $("#errorMsg").hide();
                        }
                    })
            }
        );
        $("#newPassword").blur(function () {
            if ($("#newPassword").val() == '') {
                $("#newPassword").removeClass("is-valid");
                $("#newPassword").addClass("is-invalid");
                $("#emptyPwd").show();
            } else {
                $("#newPassword").removeClass("is-invalid");
                $("#newPassword").addClass("is-valid");
                $("#emptyPwd").hide();
            }
            if ($("#checkPassword").val() != $("#newPassword").val()) {
                $("#checkPassword").removeClass("is-valid");
                $("#checkPassword").addClass("is-invalid");
                $("#errorChecked").show();
            } else {
                if ($("#checkPassword").val() == '') {
                    $("#checkPassword").removeClass("is-valid");
                    $("#checkPassword").removeClass("is-invalid");
                    $("#errorChecked").hide();
                } else {
                    $("#checkPassword").removeClass("is-invalid");
                    $("#checkPassword").addClass("is-valid");
                    $("#errorChecked").hide();
                }
            }
        });
        $("#checkPassword").blur(function () {
            if ($("#checkPassword").val() != $("#newPassword").val()) {
                $("#checkPassword").removeClass("is-valid");
                $("#checkPassword").addClass("is-invalid");
                $("#errorChecked").show();
            } else {
                if ($("#checkPassword").val() == '') {
                    $("#checkPassword").removeClass("is-valid");
                    $("#checkPassword").removeClass("is-invalid");
                    $("#errorChecked").hide();
                } else {
                    $("#checkPassword").removeClass("is-invalid");
                    $("#checkPassword").addClass("is-valid");
                    $("#errorChecked").hide();
                }
            }
        })
    });
</script>
</body>
</html>
