<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>读者管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/5.15.4/css/all.min.css">

    <style>
        body {
            background-image: url("/img/2.jpg");
            background-size: cover;
            min-height: 100vh;
        }

        .navbar-custom {
            background: linear-gradient(90deg, #21D4FD 0%, #B721FF 100%);
            font-size: 1.2rem;
        }

        .navbar-brand {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .navbar-nav .nav-link {
            font-size: 1.1rem;
            margin-right: 10px;
        }

        .dropdown-menu {
            min-width: 120px;
        }

        .user-info .dropdown-toggle {
            color: #fff !important;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 1.3rem;
            }

            .navbar-nav .nav-link {
                font-size: 1rem;
                margin-right: 0;
            }
        }

        .table-container {
            margin: 40px auto;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 12px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .table-responsive-md td,
        .table-responsive-md th {
            white-space: nowrap;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-md navbar-custom navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">图书借阅管理系统</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mr-auto" sec:authorize="hasRole('ADMIN')">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/book/getAll}">图书管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/reader/getAll}">读者管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/record/getAll}">借还管理</a>
                    </li>
                    <!-- AI 参数入口，仅管理员可见 -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/ai/settings}">AI 参数</a>
                    </li>
                    <!-- 文档新增入口，仅管理员可见 -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/document/toAddPage}">新增文档</a>
                    </li>
                </ul>
                <ul class="navbar-nav mr-auto" sec:authorize="hasRole('USER')">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user/book/getAll}">图书信息</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user/record/getOwnRecord}">借阅记录</a>
                    </li>
                </ul>
                <div class="user-info ml-auto d-flex align-items-center">
                    <div class="dropdown">
                        <a class="dropdown-toggle" href="#" id="dropdownMenuButton" data-toggle="dropdown"
                            aria-haspopup="true" aria-expanded="false" th:text="${session.name}+', 您好'"></a>
                        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownMenuButton">
                            <a class="dropdown-item" th:href="@{/user/toInfoPage}"
                                sec:authorize="hasRole('USER')">个人信息</a>
                            <a class="dropdown-item" th:href="@{/toChPwdPage}">修改密码</a>
                            <a class="dropdown-item" th:href="@{/logout}">注销</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
        <div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="table-container w-100">
            <div class="mb-3">
                <a th:href="@{/admin/user/toAddPage}" class="btn btn-outline-primary btn-lg">
                    <i class="fas fa-plus"></i>
                </a>
            </div>
            <table class="table table-hover table-responsive-md" style="margin-top: 20px">
                <thead>
                    <tr>
                        <th>卡号</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>生日</th>
                        <th>地址</th>
                        <th>电话</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="reader, readerStat: ${readers}">
                        <td th:text="${reader.getReaderId()}"></td>
                        <td th:text="${reader.getName()}"></td>
                        <td th:text="${reader.getSex()}"></td>
                        <td th:text="${#dates.format(reader.getBirth(),'yyyy-MM-dd')}"></td>
                        <td th:text="${reader.getAddress()}"></td>
                        <td th:text="${reader.getTelcode()}"></td>
                        <td><a th:href="@{/admin/reader/toEditPage/{id}(id=${reader.getReaderId()})}"
                                class="btn btn-outline-primary btn-sm">编辑</a></td>
                        <td><a th:href="@{/admin/reader/delete/{id}(id=${reader.getReaderId()})}"
                                class="btn btn-outline-danger btn-sm">删除</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.staticfile.org/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdn.staticfile.org/popper.js/1.15.0/umd/popper.min.js"></script>
    <script src="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>

</html>
