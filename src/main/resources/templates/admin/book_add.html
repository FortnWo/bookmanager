<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>新增图书</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-image: url("/img/2.jpg");
            background-size: cover;
            min-height: 100vh;
        }
        .navbar-custom {
            background: linear-gradient(90deg, #21D4FD 0%, #B721FF 100%);
            font-size: 1.2rem;
        }
        .navbar-brand {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .navbar-nav .nav-link {
            font-size: 1.1rem;
            margin-right: 10px;
        }
        .dropdown-menu {
            min-width: 120px;
        }
        .user-info .dropdown-toggle {
            color: #fff !important;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 1.3rem;
            }
            .navbar-nav .nav-link {
                font-size: 1rem;
                margin-right: 0;
            }
        }
        .form-container {
            margin: 40px auto;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        label {
            margin: auto;
            padding-right: 20px;
        }
        .input-group {
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-custom navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">图书借阅管理系统</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mr-auto" sec:authorize="hasRole('ADMIN')">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/book/getAll}">图书管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/reader/getAll}">读者管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/record/getAll}">借还管理</a>
                    </li>
                    <!-- AI 参数入口，仅管理员可见 -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/ai/settings}">AI 参数</a>
                    </li>
                    <!-- 文档新增入口，仅管理员可见 -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/document/toAddPage}">新增文档</a>
                    </li>
                </ul>
                <ul class="navbar-nav mr-auto" sec:authorize="hasRole('USER')">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user/book/getAll}">图书信息</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user/record/getOwnRecord}">借阅记录</a>
                    </li>
                </ul>
                <div class="user-info ml-auto d-flex align-items-center">
                    <div class="dropdown">
                        <a class="dropdown-toggle" href="#" id="dropdownMenuButton" data-toggle="dropdown"
                            aria-haspopup="true" aria-expanded="false" th:text="${session.name}+', 您好'"></a>
                        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownMenuButton">
                            <a class="dropdown-item" th:href="@{/user/toInfoPage}"
                                sec:authorize="hasRole('USER')">个人信息</a>
                            <a class="dropdown-item" th:href="@{/toChPwdPage}">修改密码</a>
                            <a class="dropdown-item" th:href="@{/logout}">注销</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="form-container">
        <h2 class="mb-4 text-center">添加图书</h2>
        <form th:action="@{/admin/book/add}" method="post">
            <div class="input-group">
                <label for="name">书名</label>
                <input type="text" class="form-control" id="name" name="name">
            </div>
            <div class="input-group">
                <label for="author">作者</label>
                <input type="text" class="form-control" id="author" name="author">
            </div>
            <div class="input-group">
                <label for="publish">出版社</label>
                <input type="text" class="form-control" id="publish" name="publish">
            </div>
            <div class="input-group">
                <label for="isbn">ISBN</label>
                <input type="text" class="form-control" id="isbn" name="isbn">
            </div>
            <div class="input-group">
                <label for="introduction">简介</label>
                <textarea class="form-control" id="introduction" name="introduction"></textarea>
            </div>
            <div class="input-group">
                <label for="language">语言</label>
                <input type="text" class="form-control" id="language" name="language">
            </div>
            <div class="input-group">
                <label for="price">价格</label>
                <input type="text" class="form-control" id="price" name="price">
            </div>
            <div class="input-group">
                <label for="pubdate">出版日期</label>
                <input type="text" class="form-control" id="pubdate" name="pubdate">
            </div>
            <div class="input-group">
                <label for="classId">分类号</label>
                <input type="text" class="form-control" id="classId" name="classId">
            </div>
            <div class="input-group">
                <label for="pressmark">书架号</label>
                <input type="text" class="form-control" id="pressmark" name="pressmark">
            </div>
            <div class="input-group">
                <label for="state">状态</label>
                <input type="text" class="form-control" id="state" name="state">
            </div>
            <input type="submit" value="提    交" class="btn btn-outline-primary btn-lg btn-block">
            <a th:href="@{/admin/book/getAll}" class="btn btn-outline-secondary btn-lg btn-block mt-2">取&nbsp;&nbsp;&nbsp;&nbsp;消</a>
        </form>
    </div>
</div>

<script src="https://cdn.staticfile.org/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdn.staticfile.org/popper.js/1.15.0/umd/popper.min.js"></script>
<script src="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
