<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <title>AI 参数面板</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        /* 与 index.html 保持一致的视觉样式 */
        /* 给所有元素和伪元素统一加过渡效果 */
        *,
        *::before{
        transition: all 0.3s ease-in-out; /* 0.3s 线性过渡，速度适中 */
        }
        *::after {
        transition: all 0.3s ease-in-out; /* 0.3s 线性过渡，速度适中 */
        }

        body {
            background-image: url("/img/2.jpg");
            background-size: cover;
            min-height: 100vh;
        }

        .navbar-custom {
            background: linear-gradient(90deg, #21D4FD 0%, #B721FF 100%);
        }

        .navbar-brand {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .navbar-nav .nav-link {
            font-size: 1.1rem;
            margin-right: 10px;
        }

        .dropdown-menu {
            min-width: 120px;
        }

        .user-info .dropdown-toggle {
            color: #fff !important;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 1.3rem;
            }

            .navbar-nav .nav-link {
                font-size: 1rem;
                margin-right: 0;
            }
        }

        .navbar-custom {
            background: linear-gradient(90deg, #21D4FD 0%, #B721FF 100%);
        }

        .card-bg-light {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            margin: 40px auto;
            max-width: 900px;
        }

        .form-row {
            margin-bottom: 12px;
        }

        label {
            font-weight: 600;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-md navbar-custom navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">图书借阅管理系统</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mr-auto" sec:authorize="hasRole('ADMIN')">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/book/getAll}">图书管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/reader/getAll}">读者管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/record/getAll}">借还管理</a>
                    </li>
                    <!-- AI 参数入口，仅管理员可见 -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/ai/settings}">AI 参数</a>
                    </li>
                    <!-- 文档新增入口，仅管理员可见 -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/document/toAddPage}">新增文档</a>
                    </li>
                </ul>
                <ul class="navbar-nav mr-auto" sec:authorize="hasRole('USER')">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user/book/getAll}">图书信息</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user/record/getOwnRecord}">借阅记录</a>
                    </li>
                </ul>
                <div class="user-info ml-auto d-flex align-items-center">
                    <div class="dropdown">
                        <a class="dropdown-toggle" href="#" id="dropdownMenuButton" data-toggle="dropdown"
                            aria-haspopup="true" aria-expanded="false" th:text="${session.name}+', 您好'"></a>
                        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownMenuButton">
                            <a class="dropdown-item" th:href="@{/user/toInfoPage}"
                                sec:authorize="hasRole('USER')">个人信息</a>
                            <a class="dropdown-item" th:href="@{/toChPwdPage}">修改密码</a>
                            <a class="dropdown-item" th:href="@{/logout}">注销</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="card-bg-light">
            <h3>AI 会话参数（仅管理员可见）</h3>
            <p class="text-muted">调整模型、temperature、top_p 与 max_tokens。修改后会影响管理员当前会话设置。</p>

            <div class="row">
                <div class="col-md-8">
                    <div class="form-row">
                        <label for="model">Model</label>
                        <input id="model" class="form-control" placeholder="例如 ernie-speed-128k">
                    </div>
                    <div class="form-row">
                        <label for="temperature">Temperature</label>
                        <input id="temperature" type="number" step="0.01" min="0" max="2" class="form-control"
                            placeholder="0.8">
                    </div>
                    <div class="form-row">
                        <label for="top_p">Top_p</label>
                        <input id="top_p" type="number" step="0.01" min="0" max="1" class="form-control"
                            placeholder="0.9">
                    </div>
                    <div class="form-row">
                        <label for="maxTokens">Max tokens</label>
                        <input id="maxTokens" type="number" min="1" class="form-control" placeholder="2048">
                    </div>

                    <div class="mt-3">
                        <button id="saveBtn" class="btn btn-primary">保存并生效</button>
                        <button id="resetBtn" class="btn btn-outline-secondary">恢复默认（页面）</button>
                    </div>

                    <div id="msg" class="mt-3"></div>
                </div>

                <div class="col-md-4">
                    <h5>说明</h5>
                    <ul>
                        <li>Model：后端支持所有型号的ernie模型。</li>
                        <li>Temperature：控制生成多样性（越高越随机）。</li>
                        <li>Top_p：核采样参数。</li>
                        <li>Max tokens：生成上限，注意与模型上下文限制配合。</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.staticfile.org/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdn.staticfile.org/popper.js/1.15.0/umd/popper.min.js"></script>
    <script src="https://cdn.staticfile.org/twitter-bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script>
        async function loadSettings() {
            const res = await fetch('/api/admin/ai/settings');
            if (!res.ok) { document.getElementById('msg').innerText = '加载失败'; return; }
            const j = await res.json();
            document.getElementById('model').value = j.model || '';
            document.getElementById('temperature').value = j.temperature ?? '';
            document.getElementById('top_p').value = j.topP ?? '';
            document.getElementById('maxTokens').value = j.maxTokens ?? '';
        }

        async function saveSettings() {
            const body = {
                model: document.getElementById('model').value || null,
                temperature: parseFloat(document.getElementById('temperature').value || '0'),
                topP: parseFloat(document.getElementById('top_p').value || '0'),
                maxTokens: parseInt(document.getElementById('maxTokens').value || '0')
            };
            const res = await fetch('/api/admin/ai/settings', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
            });
            const j = await res.json();
            if (res.ok && j.ok) {
                document.getElementById('msg').innerHTML = '<span class="text-success">保存成功</span>';
            } else {
                document.getElementById('msg').innerHTML = '<span class="text-danger">保存失败</span>';
            }
        }

        document.getElementById('saveBtn').addEventListener('click', saveSettings);
        document.getElementById('resetBtn').addEventListener('click', loadSettings);

        loadSettings();
    </script>
</body>

</html>
